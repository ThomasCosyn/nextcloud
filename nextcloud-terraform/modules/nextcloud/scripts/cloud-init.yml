#cloud-config

# Cloud-init configuration for Nextcloud server

hostname: nextcloud-server
fqdn: ${domain_name}

package_update: true
package_upgrade: true

packages:
  - curl
  - wget
  - git
  - unzip
  - jq
  - nginx
  - php8.1-fpm
  - php8.1-common
  - php8.1-gd
  - php8.1-mysql
  - php8.1-pgsql
  - php8.1-curl
  - php8.1-mbstring
  - php8.1-xml
  - php8.1-zip
  - php8.1-intl
  - php8.1-imagick
  - php8.1-ldap
  - php8.1-gmp
  - php8.1-bcmath
  - postgresql-client
  - certbot
  - python3-certbot-nginx
  - awscli

users:
  - name: nextcloud
    groups: www-data
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash

ssh_pwauth: false

ssh_authorized_keys:
  - ${ssh_public_key}

runcmd:
  - systemctl enable php8.1-fpm
  - systemctl start php8.1-fpm
  - systemctl enable nginx
  - systemctl start nginx
  - mkdir -p /var/www/nextcloud
  - chown www-data:www-data /var/www/nextcloud
  - mkdir -p /var/www/nextcloud/data
  - chown www-data:www-data /var/www/nextcloud/data
  - mkdir -p /var/log/nextcloud
  - chown www-data:www-data /var/log/nextcloud

final_message: |
  ==========================================
  Nextcloud Server Initialization Complete!
  ==========================================
  
  To complete the Nextcloud installation:
  
  1. Get the public IP:
     terraform output nextcloud_public_ip
  
  2. SSH into the server:
     ssh -i ~/.ssh/id_rsa ubuntu@<INSTANCE_IP>
  
  3. Download and run the installation script:
     wget https://raw.githubusercontent.com/ThomasCosyn/nextcloud/main/nextcloud-terraform/modules/nextcloud/scripts/install_nextcloud.sh
     chmod +x install_nextcloud.sh
     sudo ./install_nextcloud.sh
  
  4. Access Nextcloud at: https://${domain_name}
  
  ==========================================
