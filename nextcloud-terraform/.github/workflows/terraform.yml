  #   steps:
  #     - name: Checkout repository
  #       uses: actions/checkout@v4
  #     
  #     - name: Download Terraform Plan
  #       uses: actions/download-artifact@v4
  #       with:
  #         name: tfplan
  #     
  #     - name: Terraform Apply
  #       run: terraform apply -input=false tfplan
  #       env:
  #         SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
  #         SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
  #         TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
  #         TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
  #         TF_VAR_nextcloud_admin_password: ${{ secrets.NEXTCLOUD_ADMIN_PASSWORD }}

  terraform-check:
    name: Terraform Security Check
    runs-on: ubuntu-latest
    needs: terraform-plan
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkov Security Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          output_file: checkov-results
          soft_fail: true

      - name: Upload Checkov Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkov-results
          path: checkov-results

  terraform-docs:
    name: Generate Terraform Docs
    runs-on: ubuntu-latest
    needs: terraform-plan
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install terraform-docs
        run: pip install terraform-docs

      - name: Generate Documentation
        run: |
          terraform-docs markdown table . > TERRAFORM_DOCS.md
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add TERRAFORM_DOCS.md
          git commit -m "Update Terraform documentation" || echo "No changes to commit"
          git push
