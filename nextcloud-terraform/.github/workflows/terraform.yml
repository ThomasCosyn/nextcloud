name: Terraform

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Note: As per user request, this workflow only runs terraform plan
# and does NOT include terraform apply (manual execution preferred)

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    
    # Only run on pull requests or direct pushes to main
    # This allows for review before any changes are applied
    if: github.event_name == 'pull_request' || github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for git history

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0
          terraform_wrapper: false

      - name: Configure AWS Credentials (for Scaleway)
        # Note: Scaleway uses AWS-compatible API
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.SCW_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.SCW_SECRET_KEY }}
          aws-region: ${{ vars.SCW_REGION || 'fr-par' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}

      - name: Terraform Init
        id: init
        run: terraform init -input=false
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -diff

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -input=false -out=tfplan
          terraform show -json tfplan > tfplan.json
        env:
          # Scaleway credentials
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          
          # Terraform variables (can be set as GitHub Secrets or Variables)
          TF_VAR_scw_access_key: ${{ secrets.SCW_ACCESS_KEY }}
          TF_VAR_scw_secret_key: ${{ secrets.SCW_SECRET_KEY }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_nextcloud_admin_password: ${{ secrets.NEXTCLOUD_ADMIN_PASSWORD }}
          TF_VAR_ssl_email: ${{ vars.SSL_EMAIL || secrets.SSL_EMAIL }}

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan

      - name: Upload Terraform Plan JSON
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-json
          path: tfplan.json

      - name: Comment Plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('tfplan', 'utf8');
            
            // Get the PR number
            const prNumber = context.issue.number;
            
            // Post a comment with the plan
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `## Terraform Plan Results

<details>
<summary>Click to expand</summary>

\`\`\`
${plan}
\`\`\`
</details>

**Note:** This workflow only runs \`terraform plan\`. To apply changes, you must run \`terraform apply\` manually on your local machine or a secure environment.

**To apply manually:**
1. Download the plan artifact
2. Run: \`terraform apply tfplan\`

**⚠️ IMPORTANT:** Always review the plan carefully before applying!`
            });
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Manual approval step (commented out as per user request)
  # The user prefers manual execution, so we don't include terraform apply
  
  # terraform-apply:
  #   name: Terraform Apply
  #   needs: terraform-plan
  #   runs-on: ubuntu-latest
  #   if: false  # Disabled as per user request
  #   environment:
  #     name: production
