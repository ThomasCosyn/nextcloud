# Vhost proxy pour le nginx de l'HOTE : termine le TLS (certificats letsencrypt
# existants) et proxifie vers le conteneur docker web sur 127.0.0.1:8080.
# Reprise des headers de securite et redirections caldav/carddav de la config
# prod historique. A copier dans /etc/nginx/sites-available/nextcloud.conf.

server {
    listen 80;
    listen [::]:80;
    server_name nextcloud.goossaertcosyn.fr;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nextcloud.goossaertcosyn.fr;

    ssl_certificate /etc/letsencrypt/live/nextcloud.goossaertcosyn.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nextcloud.goossaertcosyn.fr/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/nextcloud.goossaertcosyn.fr/chain.pem;

    client_max_body_size 0;
    client_body_timeout 3600s;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_host_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains; preload;" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

    location = /.well-known/carddav {
        return 301 https://$host/remote.php/dav;
    }
    location = /.well-known/caldav {
        return 301 https://$host/remote.php/dav;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_request_buffering off;
        proxy_http_version 1.1;
    }
}
