map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # En prod : décommenter la redirection 301 vers https et TLS (cf. README)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;

    root /var/www/html;

    # nginx ne connait pas .mjs par defaut (application/octet-stream => bloque par le navigateur)
    types {
        application/javascript js mjs;
        application/wasm wasm;
    }

    client_max_body_size 0;
    client_body_timeout 3600s;

    index index.php index.html /index.php$uri$is_args$args;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
    }

    location ~ ^/(?:build|tests|config|lib|3rdparty|templates|data)(?:$|/) {
        return 404;
    }

    location ~ ^/(?:\.|autotest|occ|issue|indie|db_|console) {
        return 404;
    }

    location ~ \.(?:flv|mov|mp4|3gp|webm|m4a|mp3|ogv|ogg|wav|m4b)$ {
        try_files $uri /index.php$uri$is_args$args;
    }

    location ~ \.(?:png|html|ttf|ico|jpg|jpeg|bcmap|webp|gif|svg|woff2?|css|js|map|json)$ {
        try_files $uri /index.php$uri$is_args$args;
        add_header Cache-Control "public, max-age=15778463";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php$uri$is_args$args;
    }

    location ~ ^\/(?:index|remote|public|cron|core\/ajax\/update|status|ocs\/v[12]|updater\/.+|ocs-provider\/.+|.+\/richdocumentscode(_arm64)?\/proxy)\.php(?:$|\/) {
        fastcgi_split_path_info ^(.+?\.php)(\/.*|)$;
        set $path_info $fastcgi_path_info;
        try_files $fastcgi_script_name $fastcgi_script_name =404;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param PATH_INFO $path_info;
        fastcgi_param HTTPS off;
        fastcgi_param modHeadersAvailable true;
        fastcgi_param front_controller_active true;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi.conf;
        fastcgi_read_timeout 3600s;
    }

    location ~ ^\/(?:updater|ocs-provider)(?:$|\/.*)$ {
        try_files $uri/ =404;
        index index.php;
    }

    location ~ \.(?:css|js|woff2?|svg|gif|map|png|html|ttf|ico|jpg|jpeg|json)$ {
        try_files $uri /index.php$uri$is_args$args;
        access_log off;
    }
}
