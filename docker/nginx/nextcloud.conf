# Version docker de la conf nginx de prod (nextcloud.goossaertcosyn.fr)
# Adaptations par rapport a la prod :
# - fastcgi TCP app:9000 (au lieu du socket unix php8.3-fpm)
# - root /var/www/html (chemin du conteneur nextcloud)
# - pas de bloc 443/SSL en local : TLS termine sur l'hote (certbot) en prod
# - fastcgi.conf du conteneur remplace snippets/fastcgi-php.conf

server {
    listen 80;
    listen [::]:80;
    server_name _;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer" always;

    root /var/www/html;
    index index.php index.html index.htm;

    client_max_body_size 0;
    client_body_timeout 3600s;

    location ~ ^/\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ^/(config\.php|\.htaccess) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ^/(?:build|tests|config|lib|3rdparty|templates|data)(?:$|/) {
        return 404;
    }

    location ~ ^/(?:autotest|occ|issue|indie|db_|console) {
        return 404;
    }

    rewrite ^/caldav(.*)$ /remote.php/dav/$1 redirect;
    rewrite ^/carddav(.*)$ /remote.php/dav/$1 redirect;
    rewrite ^/webdav(.*)$ /remote.php/dav/$1 redirect;
    rewrite ^/\.well-known/carddav /remote.php/dav/ redirect;
    rewrite ^/\.well-known/caldav /remote.php/dav/ redirect;

    location / {
        rewrite ^ /index.php$request_uri;
    }

    location ~ \.php(?:$|/) {
        fastcgi_split_path_info ^(.+?\.php)(/.*|)$;
        set $path_info $fastcgi_path_info;
        try_files $fastcgi_script_name $fastcgi_script_name =404;
        fastcgi_param PATH_INFO $path_info;
        fastcgi_param HTTPS off;
        fastcgi_param modHeadersAvailable true;
        fastcgi_param front_controller_active true;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi.conf;
        fastcgi_intercept_errors on;
        fastcgi_request_buffering off;
        fastcgi_read_timeout 3600s;
        fastcgi_send_timeout 3600s;
    }

    location ~* \.(?:css|js|mjs|woff2?|svg|gif|map|json|wasm|tflite)$ {
        try_files $uri /index.php$uri$is_args$args;
        add_header Cache-Control "public, max-age=15778463";
        access_log off;
    }

    location ~* \.(?:png|html|ttf|ico|jpg|jpeg|bcmap|webp|avif)$ {
        try_files $uri /index.php$uri$is_args$args;
        access_log off;
    }
}
