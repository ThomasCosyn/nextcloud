server {
    listen 80;
    listen [::]:80;
    server_name nextcloud.goossaertcosyn.fr;
    return 301 https://\$host\$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nextcloud.goossaertcosyn.fr;

    ssl_certificate /etc/letsencrypt/live/nextcloud.goossaertcosyn.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nextcloud.goossaertcosyn.fr/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/nextcloud.goossaertcosyn.fr/chain.pem;

    client_max_body_size 0;
    client_body_timeout 3600s;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains; preload;" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Front-End-Https on;

    root /var/www/nextcloud;
    index index.php index.html index.htm;

    location ~ ^/\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ^/(config\.php|\.htaccess) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ^/data/ {
        deny all;
        access_log off;
        log_not_found off;
    }

    rewrite ^/caldav(.*)$ /remote.php/dav/$1 redirect;
    rewrite ^/carddav(.*)$ /remote.php/dav/$1 redirect;
    rewrite ^/webdav(.*)$ /remote.php/dav/$1 redirect;
    rewrite ^/\.well-known/carddav /remote.php/dav/ redirect;
    rewrite ^/\.well-known/caldav /remote.php/dav/ redirect;

    location / {
        rewrite ^ /index.php$request_uri;
    }

    location ~ \.php(?:$|/) {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm-nextcloud.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS on;
        fastcgi_param modHeadersAvailable true;
        fastcgi_param front_controller_active true;
        fastcgi_intercept_errors on;
        fastcgi_request_buffering off;
        fastcgi_read_timeout 600s;
        fastcgi_send_timeout 600s;
    }

    location ~* \.(?:css|js|mjs|woff2?|svg|gif|map|json|wasm|tflite)$ {
        try_files $uri /index.php$uri$is_args$args;
        add_header Cache-Control "public, max-age=15778463";
        access_log off;
    }

    location ~* \.(?:png|html|ttf|ico|jpg|jpeg|bcmap)$ {
        try_files $uri /index.php$uri$is_args$args;
        access_log off;
    }
}
